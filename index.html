<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>❄️ FrozenPaths ❄️</title>

  <!-- Snowy background + glow effect -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="overlay"></div>

  <h1 class="game-title">❄️ FrozenPaths ❄️</h1>

  <nav class="season-picker" aria-label="Choose a season">
    <button class="season-btn selected" type="button" data-season="winter" aria-pressed="true">❄️ Winter</button>
    <button class="season-btn" type="button" data-season="spring" aria-pressed="false">🌷 Spring</button>
    <button class="season-btn" type="button" data-season="summer" aria-pressed="false">☀️ Summer</button>
    <button class="season-btn" type="button" data-season="autumn" aria-pressed="false">🍂 Autumn</button>
  </nav>
  <p id="seasonStatus" role="status" aria-live="polite">Loading Winter...</p>

  <!-- Loading Screen -->
  <div id="loadingScreen">
    <div class="loader"></div>
    <p>Loading FrozenPaths...</p>
  </div>

  <!-- Canvas -->
  <canvas id="gameCanvas" width="800" height="480"></canvas>

  <!-- UI -->
  <div class="ui">
    <p id="message">Find the end character!</p>

    <!-- New Buttons -->
    <div class="menu">
      <button id="createMapBtn" class="file-btn">🛠️ Create Map</button>

      <button id="editMapBtn" class="file-btn">✏️ Edit Map</button>

      <label id="loadMapLabel" for="customMapInput" class="file-btn">📂 Load Map</label>
      <input type="file" id="customMapInput" accept=".txt" hidden />
    </div>
  </div>

  <!-- Main JS -->
  <script type="module" src="js/main.js"></script>
</body>

</html>
