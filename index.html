<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐧 Penguin Love Maze 🐻</title>

  <!-- Snowy background + glow effect -->
  <link rel="stylesheet" href="css/styles.css">
</head>

<body>
  <div id="overlay"></div>

  <h1 class="game-title">🐧 Penguin Love Maze 🐻</h1>

  <!-- Canvas -->
  <canvas id="gameCanvas"></canvas>

  <!-- UI -->
  <div class="ui">
    <p id="message">Find the bear!</p>

    <!-- New Buttons -->
    <div class="menu">
      <button id="createMapBtn" class="file-btn">🛠️ Create Custom Map</button>

      <label for="customMapInput" class="file-btn">📂 Load Custom Map</label>
      <input type="file" id="customMapInput" accept=".txt" hidden />
    </div>
  </div>

  <!-- Main JS -->
  <script type="module" src="js/main.js"></script>

  <!-- Map Editor redirect logic -->
  <script>
    document.getElementById('createMapBtn').addEventListener('click', () => {
      window.location.href = "map-editor.html";
    });
  </script>
</body>

</html>
