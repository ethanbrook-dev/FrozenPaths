<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Map Editor</title>
    <link rel="stylesheet" href="css/map-editor-styles.css">
</head>

<body>
    <header>
        <h1 class="editor-title">Map Editor</h1>
        <input id="mapName" type="text" placeholder="Map Name" />
    </header>

    <main id="editorMain">
        <canvas id="editorCanvas"></canvas>
        <div id="tilePalette"></div>
    </main>

    <footer>
        <button id="saveMapBtn">Save Map</button>
    </footer>

    <!-- Map Size Modal -->
    <div id="mapSizeModal" class="modal">
        <div class="modalContent">
            <h2>Create New Map</h2>
            <label>
                Width:
                <input id="mapWidthInput" type="number" value="25" min="1" max="10000">
            </label>
            <label>
                Height:
                <input id="mapHeightInput" type="number" value="25" min="1" max="10000">
            </label>
            <button id="createMapBtn">Create Map</button>
        </div>
    </div>

    <script type="module" src="./js/map-editor.js"></script>
</body>

</html>
